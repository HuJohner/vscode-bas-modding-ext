trigger:
  branches:
    include:
    - main
  tags:
    include:
    - refs/tags/v*

strategy:
  matrix:
    linux:
      imageName: 'ubuntu-latest'
    mac:
      imageName: 'macos-latest'
    windows:
      imageName: 'windows-latest'

pool:
  vmImage: $(imageName)

variables:
  dataRepositoryUrl: 'https://github.com/HuJohner/vscode-bas-modding-ext-data.git'

steps:

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- bash: |
    /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
    echo ">>> Started xvfb"
  displayName: Start xvfb
  condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

- bash: |
    echo ">>> Install dependencies"
    npm ci
    echo ">>> Run extension tests"
    npm test
    echo ">>> Tests completed"
  displayName: Run Tests
  env:
    DISPLAY: ':99.0'

- bash: |
    set -e
    echo ">>> Stage release data"
    data_repo="$(Agent.TempDirectory)/.release-data"
    trap 'rm -rf "$data_repo"' EXIT
    git clone --depth 1 "$(dataRepositoryUrl)" "$data_repo"
    cp -R "$data_repo/schemas" ./schemas
    cp -R "$data_repo/snippets" ./snippets
    cp "$data_repo/type-resolvers.json" ./type-resolvers.json
    test -f ./type-resolvers.json
    test -d ./schemas
    test -d ./snippets
  displayName: Stage release data
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'), eq(variables['Agent.OS'], 'Linux'))

- task: AzureCLI@2
  displayName: Publish using managed identity
  inputs:
    azureSubscription: 'vscode-marketplace-publish'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -e
      trap 'rm -rf schemas snippets type-resolvers.json' EXIT
      cd "$(Build.SourcesDirectory)"
      npm run deploy
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'), eq(variables['Agent.OS'], 'Linux'))