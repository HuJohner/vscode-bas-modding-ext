trigger:
  branches:
    include:
    - main
  tags:
    include:
    - refs/tags/v*

strategy:
  matrix:
    linux:
      imageName: 'ubuntu-latest'
    mac:
      imageName: 'macos-latest'
    windows:
      imageName: 'windows-latest'

pool:
  vmImage: $(imageName)

variables:
  dataRepositoryUrl: 'https://github.com/HuJohner/vscode-bas-modding-ext-data.git'

steps:

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- bash: |
    /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
    echo ">>> Started xvfb"
  displayName: Start xvfb
  condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

- bash: |
    echo ">>> Compile vscode-test"
    yarn && yarn compile
    echo ">>> Compiled vscode-test"
    cd sample
    echo ">>> Run sample integration test"
    yarn && yarn compile && yarn test
  displayName: Run Tests
  env:
    DISPLAY: ':99.0'

- bash: |
    echo ">>> Publish"
    data_repo="$(Build.SourcesDirectory)/.release-data"
    trap 'rm -rf "$data_repo" schemas snippets type-resolvers.json' EXIT
    git clone --depth 1 "$(dataRepositoryUrl)" "$data_repo"
    cp -R "$data_repo/schemas" ./schemas
    cp -R "$data_repo/snippets" ./snippets
    cp "$data_repo/type-resolvers.json" ./type-resolvers.json
    test -f ./type-resolvers.json
    test -d ./schemas
    test -d ./snippets
    yarn deploy
  displayName: Publish
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'), eq(variables['Agent.OS'], 'Linux'))
  env:
    VSCE_PAT: $(VSCE_PAT)